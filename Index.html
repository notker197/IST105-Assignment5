<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Treasure Hunt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to the Interactive Treasure Hunt!</h1>
        <p>Solve the puzzle and find the treasure.</p>
    </header>
    
    <section>
        <h2>Enter Your Details</h2>
        <form action="form.php" method="post">
            <label for="number">Enter a Number</label>
            <input type="number" name="number" required><br><br>

            <label for="text">Enter a Text Message:</label>
            <input type="text" name="text" required><br><br>

            <input type="submit" value="Solve the Puzzle">
        </form>
    </section>
    
</body>
</html>
